name: Prune Registry
on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *
env:
  PROJECT_NAME: docker-mysqldump

jobs:
  prune-images:
    runs-on: ubuntu-latest
    steps:
      - name: Prune
        uses: vlaurin/action-ghcr-prune@v0.6.0
        with:
          token: ${{ secrets.GH_TOKEN_PRUNE }}
          container: ${{ env.PROJECT_NAME }}
          dry-run: false
          keep-younger-than: 0 # days
          keep-last: 6
          prune-untagged: true
